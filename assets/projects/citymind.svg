<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8D5C0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5E6D3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5C3D2E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8879C;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="200" fill="url(#bg)"/>
  <!-- City grid -->
  <g opacity="0.3">
    <rect x="50" y="80" width="30" height="60" fill="#5C3D2E"/>
    <rect x="90" y="60" width="25" height="80" fill="#5C3D2E"/>
    <rect x="125" y="90" width="35" height="50" fill="#5C3D2E"/>
    <rect x="170" y="50" width="28" height="90" fill="#5C3D2E"/>
    <rect x="210" y="70" width="32" height="70" fill="#5C3D2E"/>
    <rect x="255" y="85" width="27" height="55" fill="#5C3D2E"/>
    <rect x="295" y="65" width="30" height="75" fill="#5C3D2E"/>
    <rect x="340" y="75" width="25" height="65" fill="#5C3D2E"/>
  </g>
  <!-- AI brain icon -->
  <circle cx="200" cy="100" r="40" fill="url(#accent)" opacity="0.9"/>
  <text x="200" y="108" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#FBF3EB" text-anchor="middle">AI</text>
  <!-- Neural connections -->
  <g stroke="#E8879C" stroke-width="2" opacity="0.6">
    <line x1="160" y1="100" x2="120" y2="80"/>
    <line x1="160" y1="100" x2="120" y2="120"/>
    <line x1="240" y1="100" x2="280" y2="80"/>
    <line x1="240" y1="100" x2="280" y2="120"/>
    <line x1="200" y1="60" x2="200" y2="30"/>
    <line x1="200" y1="140" x2="200" y2="170"/>
  </g>
  <circle cx="120" cy="80" r="6" fill="#E8879C"/>
  <circle cx="120" cy="120" r="6" fill="#E8879C"/>
  <circle cx="280" cy="80" r="6" fill="#E8879C"/>
  <circle cx="280" cy="120" r="6" fill="#E8879C"/>
  <circle cx="200" cy="30" r="6" fill="#E8879C"/>
  <circle cx="200" cy="170" r="6" fill="#E8879C"/>
</svg>
