<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5E6D3"/>
      <stop offset="100%" style="stop-color:#E8D5C0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6B4C3B"/>
      <stop offset="100%" style="stop-color:#E8A0BF"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Hospital cross -->
  <g transform="translate(400,180)" fill="none" stroke="url(#accent)" stroke-width="3">
    <rect x="-60" y="-20" width="120" height="40" rx="5"/>
    <rect x="-20" y="-60" width="40" height="120" rx="5"/>
  </g>
  <!-- Database cylinders -->
  <g transform="translate(200,300)" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.5">
    <ellipse cx="0" cy="0" rx="40" ry="10"/>
    <path d="M-40,0 L-40,40 Q0,55 40,40 L40,0"/>
    <ellipse cx="0" cy="40" rx="40" ry="10"/>
  </g>
  <g transform="translate(600,300)" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.5">
    <ellipse cx="0" cy="0" rx="40" ry="10"/>
    <path d="M-40,0 L-40,40 Q0,55 40,40 L40,0"/>
    <ellipse cx="0" cy="40" rx="40" ry="10"/>
  </g>
  <!-- Connection lines -->
  <g stroke="url(#accent)" stroke-width="1.5" opacity="0.3">
    <line x1="240" y1="300" x2="380" y2="200"/>
    <line x1="560" y1="300" x2="420" y2="200"/>
  </g>
  <!-- Title -->
  <text x="400" y="420" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="url(#accent)" text-anchor="middle">IVOR</text>
  <text x="400" y="450" font-family="Arial, sans-serif" font-size="14" fill="#8B6F5C" text-anchor="middle">Hospital Management System</text>
</svg>
