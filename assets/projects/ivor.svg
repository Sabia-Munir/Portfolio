<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8D5C0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5E6D3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5C3D2E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8879C;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="200" fill="url(#bg)"/>
  <!-- Hospital building -->
  <rect x="150" y="50" width="100" height="100" fill="#5C3D2E" opacity="0.3" rx="5"/>
  <rect x="160" y="60" width="20" height="15" fill="#FBF3EB" opacity="0.5"/>
  <rect x="190" y="60" width="20" height="15" fill="#FBF3EB" opacity="0.5"/>
  <rect x="220" y="60" width="20" height="15" fill="#FBF3EB" opacity="0.5"/>
  <rect x="160" y="85" width="20" height="15" fill="#FBF3EB" opacity="0.5"/>
  <rect x="190" y="85" width="20" height="15" fill="#FBF3EB" opacity="0.5"/>
  <rect x="220" y="85" width="20" height="15" fill="#FBF3EB" opacity="0.5"/>
  <rect x="185" y="120" width="30" height="30" fill="#E8879C" opacity="0.8"/>
  <!-- Cross symbol -->
  <rect x="195" y="125" width="10" height="20" fill="#FBF3EB"/>
  <rect x="190" y="130" width="20" height="10" fill="#FBF3EB"/>
  <!-- Database cylinders -->
  <g transform="translate(80, 90)" opacity="0.5">
    <ellipse rx="20" ry="8" fill="#E8879C"/>
    <rect x="-20" y="0" width="40" height="30" fill="#E8879C"/>
    <ellipse cx="0" cy="30" rx="20" ry="8" fill="#D46B82"/>
  </g>
  <g transform="translate(320, 90)" opacity="0.5">
    <ellipse rx="20" ry="8" fill="#E8879C"/>
    <rect x="-20" y="0" width="40" height="30" fill="#E8879C"/>
    <ellipse cx="0" cy="30" rx="20" ry="8" fill="#D46B82"/>
  </g>
  <!-- Connection lines -->
  <g stroke="#5C3D2E" stroke-width="2" opacity="0.3" stroke-dasharray="5,5">
    <line x1="100" y1="100" x2="150" y2="100"/>
    <line x1="250" y1="100" x2="300" y2="100"/>
  </g>
</svg>
