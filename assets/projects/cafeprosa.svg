<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8D5C0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5E6D3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5C3D2E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8879C;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="200" fill="url(#bg)"/>
  <!-- 3D cube wireframe -->
  <g stroke="#5C3D2E" stroke-width="2" fill="none" opacity="0.4">
    <polygon points="200,40 260,70 260,130 200,160 140,130 140,70"/>
    <line x1="200" y1="40" x2="200" y2="160"/>
    <line x1="140" y1="70" x2="260" y2="70"/>
    <line x1="140" y1="130" x2="260" y2="130"/>
  </g>
  <!-- Coffee cup -->
  <ellipse cx="200" cy="100" rx="35" ry="12" fill="#E8879C" opacity="0.8"/>
  <rect x="165" y="100" width="70" height="40" fill="#E8879C" opacity="0.8" rx="5"/>
  <ellipse cx="200" cy="140" rx="35" ry="12" fill="#D46B82"/>
  <!-- Steam -->
  <g stroke="#5C3D2E" stroke-width="2" fill="none" opacity="0.3">
    <path d="M185,85 Q180,70 185,55"/>
    <path d="M200,80 Q195,65 200,50"/>
    <path d="M215,85 Q210,70 215,55"/>
  </g>
  <!-- React logo hint -->
  <g transform="translate(320, 100)" opacity="0.5">
    <ellipse rx="25" ry="10" fill="none" stroke="#E8879C" stroke-width="2" transform="rotate(0)"/>
    <ellipse rx="25" ry="10" fill="none" stroke="#E8879C" stroke-width="2" transform="rotate(60)"/>
    <ellipse rx="25" ry="10" fill="none" stroke="#E8879C" stroke-width="2" transform="rotate(120)"/>
  </g>
</svg>
